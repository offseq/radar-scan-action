name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # Runs the action end to end when the repository has a RADAR_API_KEY secret.
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - id: key
        env:
          RADAR_API_KEY: ${{ secrets.RADAR_API_KEY }}
        run: echo "present=${RADAR_API_KEY:+true}" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'true'
        id: radar
        uses: ./
        with:
          api-key: ${{ secrets.RADAR_API_KEY }}
          file: test/package-lock.json
          upload-sarif: ${{ github.event_name != 'pull_request' }}
      - if: steps.key.outputs.present == 'true'
        run: test "${{ steps.radar.outputs.gate-tripped }}" = false

  # Runs the action against a local stub that replays a fixture response.
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          python3 - <<'PY' &
          from http.server import BaseHTTPRequestHandler, HTTPServer
          body = open("test/scan-incomplete.json", "rb").read()
          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  self.rfile.read(int(self.headers["Content-Length"]))
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(body)
          HTTPServer(("127.0.0.1", 8080), H).serve_forever()
          PY
          until curl -s -o /dev/null http://127.0.0.1:8080; do sleep 0.2; done
      - id: radar
        continue-on-error: true
        uses: ./
        with:
          api-key: test
          file: test/package-lock.json
          fail-on: high
          upload-sarif: false
          api-url: http://127.0.0.1:8080
      - id: tolerant
        uses: ./
        with:
          api-key: test
          file: test/package-lock.json
          fail-on: high
          fail-on-incomplete: false
          upload-sarif: false
          api-url: http://127.0.0.1:8080
      - run: |
          test "${{ steps.radar.outcome }}" = failure
          test "${{ steps.radar.outputs.gate-tripped }}" = false
          test "${{ steps.radar.outputs.gate-incomplete }}" = true
          test "${{ steps.tolerant.outputs.gate-incomplete }}" = true
