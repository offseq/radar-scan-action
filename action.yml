name: OffSeq Radar scan
description: Check an SBOM or lockfile against OffSeq Threat Radar, upload SARIF to code scanning and gate the build.
author: OffSeq
branding:
  icon: shield
  color: red

inputs:
  api-key:
    description: Radar API key (store it as a secret).
    required: true
  file:
    description: SBOM or lockfile to scan, e.g. package-lock.json, yarn.lock, poetry.lock, go.sum, bom.cdx.json.
    required: true
  fail-on:
    description: Fail the job on a confirmed finding at this level - critical, high, medium, low, kev or exploited. Empty never fails.
    required: false
    default: ''
  upload-sarif:
    description: Upload the SARIF report to GitHub code scanning (needs security-events write permission).
    required: false
    default: 'true'
  api-url:
    description: Radar base URL.
    required: false
    default: https://radar.offseq.com

outputs:
  gate-tripped:
    description: '"true" when fail-on matched a confirmed finding.'
    value: ${{ steps.scan.outputs.gate-tripped }}
  sarif-file:
    description: Path of the SARIF report, when upload-sarif is true.
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        RADAR_API_KEY: ${{ inputs.api-key }}
        RADAR_FILE: ${{ inputs.file }}
        RADAR_FAIL_ON: ${{ inputs.fail-on }}
        RADAR_UPLOAD: ${{ inputs.upload-sarif }}
        RADAR_URL: ${{ inputs.api-url }}
      run: |
        set -euo pipefail
        [ -f "$RADAR_FILE" ] || { echo "::error::File not found: $RADAR_FILE"; exit 1; }
        body="$RUNNER_TEMP/radar-body.json"
        out="$RUNNER_TEMP/radar-scan.json"
        # Repo-relative, so SARIF locations link to the file in code scanning.
        file="$(cd "$(dirname "$RADAR_FILE")" && pwd -P)/$(basename "$RADAR_FILE")"
        filename="${file#"$(cd "$GITHUB_WORKSPACE" && pwd -P)/"}"
        jq -n --rawfile content "$RADAR_FILE" --arg filename "$filename" '{content: $content, filename: $filename}' > "$body"

        status=$(curl -sS -o "$out" -w '%{http_code}' -X POST \
          "$RADAR_URL/api/v1/scan?format=all${RADAR_FAIL_ON:+&failOn=$RADAR_FAIL_ON}" \
          -H "X-API-Key: $RADAR_API_KEY" -H 'Content-Type: application/json' --data-binary "@$body")
        if [ "$status" != 200 ]; then
          echo "::error::Radar scan failed (HTTP $status): $(jq -r '.message // .error // empty' "$out" 2>/dev/null || true)"
          exit 1
        fi

        jq -r '.markdown' "$out" >> "$GITHUB_STEP_SUMMARY"
        echo "gate-tripped=$(jq -r '.data.gate.tripped == true' "$out")" >> "$GITHUB_OUTPUT"

        if [ "$RADAR_UPLOAD" = true ]; then
          jq '.sarif' "$out" > "$RUNNER_TEMP/radar.sarif"
          echo "sarif-file=$RUNNER_TEMP/radar.sarif" >> "$GITHUB_OUTPUT"
        fi

    - if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: offseq-radar

    - if: steps.scan.outputs.gate-tripped == 'true'
      shell: bash
      env:
        RADAR_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "::error::OffSeq Radar found a confirmed $RADAR_FAIL_ON finding. See the job summary."
        exit 1
